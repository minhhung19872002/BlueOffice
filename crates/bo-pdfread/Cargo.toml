[package]
name = "bo-pdfread"
description = "Read PDF files into BlueOffice display lists (BlueReader, later BlueEditor): page tree, content streams, fonts, images, text with positions, outlines, annotations."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["bundled-fonts"]
# Substitutes for the standard 14 fonts compiled in (Tinos, Liberation Sans; OFL / Apache-2.0).
bundled-fonts = []

[dependencies]
bo-render.workspace = true
bo-text.workspace = true
lopdf = { version = "0.38", default-features = false, features = ["rayon"] }
ttf-parser.workspace = true
miniz_oxide = "0.8"
png.workspace = true
weezl = "0.1"
# JPEG 2000, JBIG2 and CCITT fax decoders (MIT OR Apache-2.0), without their image/SIMD extras.
hayro-ccitt = { version = "0.5", default-features = false }
hayro-jbig2 = { version = "0.4", default-features = false, features = ["std"] }
hayro-jpeg2000 = { version = "0.5", default-features = false, features = ["std"] }
zune-jpeg = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
bo-raster.workspace = true
png.workspace = true
bo-engine = { workspace = true, features = ["bundled-fonts"] }

[lints]
workspace = true
