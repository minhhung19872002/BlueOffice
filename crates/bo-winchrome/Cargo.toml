[package]
name = "bo-winchrome"
description = "Native window chrome of the BlueOffice desktop shell on Windows: snap layouts on the custom maximise button, system menu, OS build (ADR-0016)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]

[target.'cfg(windows)'.dependencies]
# MIT OR Apache-2.0 (microsoft/windows-rs); same versions as Tauri's dependency tree.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
windows-version = "0.1"

# The workspace forbids `unsafe_code`; this crate is the one documented exception (ADR-0016):
# Win32 calls need `unsafe`, confined to `src/win32.rs`. Everything else matches [workspace.lints].
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
similar_names = "allow"
doc_markdown = "allow"
