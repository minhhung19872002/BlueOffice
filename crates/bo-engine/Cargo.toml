[package]
name = "bo-engine"
description = "Facade over the BlueOffice core pipeline, shared by WASM, desktop and CLI hosts."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
# Compile the fonts from assets/fonts into the binary (CLI, desktop, tests).
bundled-fonts = []

[dependencies]
bo-model.workspace = true
bo-docx.workspace = true
bo-edit.workspace = true
bo-pptx = { path = "../bo-pptx" }
bo-drawingml = { path = "../bo-drawingml" }
bo-model3d = { path = "../bo-model3d" }
bo-text.workspace = true
bo-spell.workspace = true
bo-math.workspace = true
bo-layout.workspace = true
bo-render.workspace = true
bo-raster.workspace = true
bo-pdf.workspace = true
bo-sheet.workspace = true
bo-formula.workspace = true
bo-xlsx.workspace = true
bo-binary = { path = "../bo-binary" }
bo-encoding = { path = "../bo-encoding" }
bo-odf = { path = "../bo-odf" }
bo-html.workspace = true
bo-tabular.workspace = true
bo-query = { path = "../bo-query" }
bo-crypto = { path = "../bo-crypto" }
bo-opc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64 = "0.22"
zip.workspace = true

[dev-dependencies]
zune-jpeg = { version = "0.4", default-features = false, features = ["std"] }
# Content streams of printed PDFs are inflated in tests (CORE-PRINT-001).
miniz_oxide = "0.8"
bo-collab = { path = "../bo-collab" }
# Signature lines are signed with bo-sign (tests/sigline.rs).
bo-sign = { path = "../bo-sign" }
rand = "0.8"
png.workspace = true
bo-opc.workspace = true
bo-engine = { path = ".", features = ["bundled-fonts"] }
insta.workspace = true
proptest.workspace = true
criterion.workspace = true
# Heap bytes in use for the open/close leak test (CORE-PERF-001, tests/open_close_leak.rs).
stats_alloc = "0.1.10"

[[bench]]
name = "sheet_edit"
harness = false

[[bench]]
name = "doc_typing"
harness = false

[[bench]]
name = "sheet_big"
harness = false

[lints]
workspace = true
