[package]
name = "bo-native-win"
description = "BlueDoc on Windows with the self-drawn Rust interface (ADR-0018): Win32 window, Direct2D/DirectWrite, in-process engine."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "bluedoc-native"
path = "src/main.rs"

[dependencies]
bo-engine = { workspace = true, features = ["bundled-fonts"] }
bo-render.workspace = true
bo-raster.workspace = true
bo-ui = { path = "../../crates/bo-ui" }

[target.'cfg(windows)'.dependencies]
bo-gpu-win = { path = "../../crates/bo-gpu-win" }
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# The workspace forbids `unsafe_code`; Win32 calls are confined to `src/win32.rs` (ADR-0018),
# like bo-winchrome (ADR-0016). Everything else matches [workspace.lints].
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
similar_names = "allow"
doc_markdown = "allow"
