<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Add-in mẫu</title>
    <style>
      body {
        font: 13px sans-serif;
        margin: 8px;
      }
      button {
        display: block;
        margin: 4px 0;
      }
    </style>
  </head>
  <body>
    <p id="status">Đang kết nối…</p>
    <button id="read-selection" type="button">Đọc vùng chọn</button>
    <button id="insert" type="button">Chèn</button>
    <button id="read-document" type="button">Đọc tài liệu</button>
    <button id="store" type="button">Lưu</button>
    <pre id="out"></pre>
    <pre id="events"></pre>
    <!-- The SDK (a copy of the editor's /addin-sdk/v1.js), then the add-in's own script (no inline script: CSP). -->
    <script src="addin-sdk.js"></script>
    <script src="app.js"></script>
  </body>
</html>
