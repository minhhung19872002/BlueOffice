[package]
name = "bo-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "LicenseRef-BlueOffice-Proprietary"

# cargo-fuzz targets (prompt §7). Not part of the product workspace and not
# run in CI on Windows: `cargo +nightly fuzz run <target>` on Linux/macOS.
# CI replays the OOXML target bodies over a mutated corpus instead
# (crates/bo-engine/tests/fuzz_smoke.rs); the binary/crypto/ODF/encoding/formula
# parsers have `*_never_panic*` property tests next to their code.
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bo-binary = { path = "../crates/bo-binary" }
bo-crypto = { path = "../crates/bo-crypto" }
bo-odf = { path = "../crates/bo-odf" }
bo-encoding = { path = "../crates/bo-encoding" }
bo-opc = { path = "../crates/bo-opc" }
bo-docx = { path = "../crates/bo-docx" }
bo-xlsx = { path = "../crates/bo-xlsx" }
bo-pptx = { path = "../crates/bo-pptx" }
bo-formula = { path = "../crates/bo-formula" }
bo-html = { path = "../crates/bo-html" }

# Keep this crate out of the root workspace.
[workspace]
members = []

[profile.release]
debug = 1

[[bin]]
name = "doc"
path = "fuzz_targets/doc.rs"
test = false
doc = false
bench = false

