# Two api instances behind the web proxy (docs/deploy/README.md "Nhiều instance api"):
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.multi.yml --env-file deploy/.env up -d
# Rooms are leased in Redis (Collab__Ownership=Redis); session ids carry the instance id = host name,
# which the proxy uses to route /api/sessions/{instance}~{id}.
x-multi-env: &multi-env
  Collab__Ownership: Redis

services:
  api:
    hostname: api-1
    environment:
      <<: *multi-env
      Collab__InstanceId: api-1
    networks:
      default:
        aliases: [api-1]

  api-2:
    extends: { file: docker-compose.yml, service: api }
    hostname: api-2
    ports: !reset []
    environment:
      <<: *multi-env
      Collab__InstanceId: api-2

  web:
    volumes:
      - ./web/nginx-multi.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - api-2
