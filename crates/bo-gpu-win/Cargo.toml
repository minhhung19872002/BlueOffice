[package]
name = "bo-gpu-win"
description = "Windows Direct2D device setup for the BlueOffice renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bo-render.workspace = true

[target.'cfg(windows)'.dependencies]
bo-dwrite = { path = "../bo-dwrite" }
bo-text.workspace = true
windows-numerics = "0.3.1"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
bo-engine = { path = "../bo-engine", features = ["bundled-fonts"] }
bo-ui = { path = "../bo-ui" }
bo-raster.workspace = true
serde_json.workspace = true

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
