[package]
name = "bo-native-win"
description = "BlueDoc on Windows with the self-drawn Rust interface (ADR-0018): Win32 window, Direct2D/DirectWrite, in-process engine."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "bluedoc-native"
path = "src/main.rs"

[[bin]]
name = "blueslide-native"
path = "src/slide_main.rs"

[[bin]]
name = "bluesheet-native"
path = "src/sheet_main.rs"

[[bin]]
name = "bluereader-native"
path = "src/reader_main.rs"

[[bin]]
name = "blueeditor-native"
path = "src/editor_main.rs"

[dependencies]
bo-engine = { workspace = true, features = ["bundled-fonts"] }
bo-render.workspace = true
bo-raster.workspace = true
bo-ui = { path = "../../crates/bo-ui" }
bo-pdfread = { path = "../../crates/bo-pdfread" }
bo-opc.workspace = true
bo-text.workspace = true
png.workspace = true
base64 = "0.22"
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
bo-gpu-win = { path = "../../crates/bo-gpu-win" }
# `#[implement]` of BlueReader's UI Automation provider names this crate (already in the tree).
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Printing",
  "Win32_Media_Speech",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_System_Registry",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

# The workspace forbids `unsafe_code`; Win32 calls are confined to `src/win32.rs` (ADR-0018),
# like bo-winchrome (ADR-0016). Everything else matches [workspace.lints].
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
similar_names = "allow"
doc_markdown = "allow"
