name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      - run: cargo clippy -p bo-wasm -p bo-collab -p bo-formula --target wasm32-unknown-unknown -- -D warnings
      - run: cargo build -p bo-wasm --target wasm32-unknown-unknown --release

  perf:
    name: Performance targets (prompt §5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Typing < 16 ms in a 300-page document (release timing test).
      - run: cargo test --release -p bo-engine --test typing_perf -- --ignored --nocapture
      # Open a 300-page .docx with pictures and a 1M-cell / 100k-formula .xlsx (native).
      - run: |
          mkdir -p out
          cargo run --release -p bo-cli -- sample-big out/big.docx
          cargo run --release -p bo-cli -- sample-big-sheet out/big.xlsx
          cargo run --release -p bo-cli -- bench out/big.docx --iterations 3
          cargo run --release -p bo-cli -- bench out/big.xlsx --iterations 3
      # Criterion benches compile and run once (numbers in the job log).
      - run: |
          cargo bench -p bo-layout --bench layout -- --warm-up-time 1 --measurement-time 3
          cargo bench -p bo-formula --bench recalc -- --warm-up-time 1 --measurement-time 3

  fuzz:
    name: Fuzz parsers (cargo-fuzz, 60 s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Run every fuzz target
        working-directory: fuzz
        run: |
          for t in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$t" -- -max_total_time=60 -rss_limit_mb=2048
          done

  cargo-deny:
    name: cargo deny (licenses, advisories, bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
      # The release desktop build enables the updater (reqwest, rustls, minisign-verify, …).
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --features bo-desktop/updater
          command: check licenses bans sources

  web:
    name: Web (lint, typecheck, unit, build, E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install wasm-bindgen CLI (must match crate version)
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:wasm
      - run: cargo build -p bo-cli
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm license-check
      - run: pnpm --filter @blueoffice/web build
      - run: pnpm --filter @blueoffice/e2e exec playwright install --with-deps chromium
      # Collaboration E2E (playwright.collab.config.ts) runs the real server + mock BlueDrive.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/playwright-report-collab
            tests/fidelity/output

  dotnet:
    name: .NET (format, build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: cargo build -p bo-cli
      - run: dotnet format BlueOffice.sln --verify-no-changes
      - run: dotnet test BlueOffice.sln -c Release

  fidelity:
    name: Fidelity (round-trip corpus + OpenXmlValidator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build -p bo-cli
      - run: npm i -g pnpm@9 && pnpm install --frozen-lockfile
      - run: node scripts/fidelity-report.mjs
      - run: node scripts/visual-diff.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fidelity-report
          path: |
            docs/fidelity-report.md
            tests/fidelity/history.csv
            tests/fidelity/output/roundtrip
            tests/fidelity/output/diff
            docs/fidelity-visual.md

  desktop:
    name: Desktop (${{ matrix.os }}, package + E2E)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: NSIS installer, then the WebDriver E2E (tauri-driver + msedgedriver).
          - os: windows-latest
            bundles: nsis
            e2e: true
          # macOS: .app bundle (no WebDriver for WKWebView, so no E2E).
          - os: macos-latest
            bundles: app
            e2e: false
          # Linux: .deb + AppImage (WebKitGTK).
          - os: ubuntu-22.04
            bundles: deb,appimage
            e2e: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        if: matrix.e2e
        with:
          dotnet-version: 8.0.x
      # The desktop web view runs the bo-collab replica (WASM) for live collaboration.
      - name: Install wasm-bindgen CLI (must match crate version)
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:wasm
      # Release build with the Tauri updater (plugins.updater in tauri.conf.json, docs/deploy/desktop-update.md).
      - run: pnpm --filter @blueoffice/desktop tauri build --features updater --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: bluedoc-${{ matrix.os }}
          path: target/release/bundle
          if-no-files-found: error
      # Web shell + browser for the deep-link collaboration and the parity (P1.10) cases.
      - run: pnpm --filter @blueoffice/web build
        if: matrix.e2e
      - run: pnpm --filter @blueoffice/e2e exec playwright install chromium
        if: matrix.e2e
      # Desktop E2E through Tauri WebDriver. msedgedriver must match the WebView2 runtime
      # (not the Edge browser the runner's EDGEWEBDRIVER driver is built for).
      - run: cargo install tauri-driver --locked
        if: matrix.e2e
      - name: msedgedriver matching the WebView2 runtime
        if: matrix.e2e
        shell: pwsh
        run: |
          $client = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = $null
          foreach ($key in @(
              "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$client",
              "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$client",
              "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$client")) {
            $pv = (Get-ItemProperty -Path $key -Name pv -ErrorAction SilentlyContinue).pv
            if ($pv -and $pv -ne '0.0.0.0') { $version = $pv; break }
          }
          if (-not $version) {
            $exe = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe" -ErrorAction SilentlyContinue |
              Sort-Object { [version]$_.Directory.Name } | Select-Object -Last 1
            if ($exe) { $version = $exe.Directory.Name }
          }
          if (-not $version) { throw 'WebView2 runtime not found' }
          Write-Host "WebView2 runtime $version"
          $dir = Join-Path $env:RUNNER_TEMP 'msedgedriver'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $zip = Join-Path $dir 'edgedriver_win64.zip'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir -Force
          $driver = Join-Path $dir 'msedgedriver.exe'
          & $driver --version
          "MSEDGEDRIVER=$driver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # Does the app's WebView2 open the debugging port msedgedriver needs? (Edge policies,
      # WEBVIEW2_* variables and the browser process command line.)
      - name: Desktop app start diagnostics
        if: matrix.e2e
        continue-on-error: true
        shell: pwsh
        run: |
          foreach ($k in 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2', 'HKLM:\SOFTWARE\Policies\Microsoft\Edge',
              'HKCU:\SOFTWARE\Policies\Microsoft\Edge', 'HKLM:\SOFTWARE\WOW6432Node\Policies\Microsoft\Edge') {
            if (Test-Path $k) {
              Write-Host "== $k"; Get-ItemProperty $k | Out-String | Write-Host
              Get-ChildItem $k -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  sub: $($_.Name)" }
            }
          }
          Get-ChildItem env: | Where-Object Name -like 'WEBVIEW2*' | Out-String | Write-Host
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9333'
          $p = Start-Process target\release\bluedoc.exe -ArgumentList 'tests\corpus\doc\review-01-insert-delete.docx' -PassThru
          Start-Sleep 20
          Write-Host "alive: $(-not $p.HasExited)"
          try { (Invoke-WebRequest http://127.0.0.1:9333/json/version -UseBasicParsing).Content | Write-Host } catch { Write-Host "no debugging port: $_" }
          $wv = Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" | Where-Object { $_.CommandLine -match 'bluedoc' }
          $wv | Where-Object { $_.CommandLine -notmatch '--type=' } | ForEach-Object { Write-Host "browser: $($_.CommandLine)" }
          $wv | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
      - run: pnpm test:e2e:desktop
        if: matrix.e2e
