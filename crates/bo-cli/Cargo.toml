[package]
name = "bo-cli"
description = "BlueOffice command-line tool: render, convert, dump, pack/unpack, bench."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "bo-cli"
path = "src/main.rs"

[dependencies]
