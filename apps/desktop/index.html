<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlueDoc</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
      }
      /* The window is transparent for Mica (ADR-0016): opaque page until the title bar asks
         for the backdrop (theme.css, html[data-backdrop='mica']). */
      html {
        background: var(--bo-bg, #eef1f5);
      }
      .startup-frame {
        height: 100%;
        display: flex;
        flex-direction: column;
        background: #e8ebf0;
      }
      .startup-title,
      .startup-status {
        background: #f3f5f8;
        flex: none;
      }
      .startup-title {
        height: 32px;
      }
      .startup-ribbon {
        height: 120px;
        background: #fbfcfd;
        flex: none;
      }
      .startup-page {
        flex: 1;
      }
      .startup-status {
        height: 24px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="startup-frame" aria-busy="true" aria-label="Đang mở BlueOffice">
        <div class="startup-title"></div>
        <div class="startup-ribbon"></div>
        <div class="startup-page"></div>
        <div class="startup-status"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
