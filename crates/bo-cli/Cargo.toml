[package]
name = "bo-cli"
description = "BlueOffice command-line tool: render, convert, dump, pack/unpack, bench."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "bo-cli"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
bo-engine = { workspace = true, features = ["bundled-fonts"] }
bo-model.workspace = true
bo-docx.workspace = true
bo-opc.workspace = true
bo-xlsx.workspace = true
bo-sheet = { path = "../bo-sheet" }
bo-binary = { path = "../bo-binary" }
bo-odf = { path = "../bo-odf" }
bo-html.workspace = true
bo-tabular.workspace = true
bo-math.workspace = true
bo-pdf.workspace = true
bo-crypto = { path = "../bo-crypto" }
bo-sign = { path = "../bo-sign", features = ["http", "pkcs12"] }
serde_json.workspace = true
quick-xml.workspace = true
bo-pptx = { path = "../bo-pptx" }
bo-model3d = { path = "../bo-model3d" }
clap.workspace = true
png.workspace = true

[dev-dependencies]
serde_json.workspace = true
# Throwaway signing keys for the sign/verify CLI tests (bo_sign::testing).
rand = "0.8"

[lints]
workspace = true
