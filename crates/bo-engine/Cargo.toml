[package]
name = "bo-engine"
description = "Facade over the BlueOffice core pipeline, shared by WASM, desktop and CLI hosts."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
# Compile the fonts from assets/fonts into the binary (CLI, desktop, tests).
bundled-fonts = []

[dependencies]
bo-model.workspace = true
bo-docx.workspace = true
bo-pptx = { path = "../bo-pptx" }
bo-text.workspace = true
bo-layout.workspace = true
bo-render.workspace = true
bo-raster.workspace = true
bo-pdf.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
bo-engine = { path = ".", features = ["bundled-fonts"] }
insta.workspace = true

[lints]
workspace = true
