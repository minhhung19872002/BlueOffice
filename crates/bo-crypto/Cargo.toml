[package]
name = "bo-crypto"
description = "Password-protected documents per [MS-OFFCRYPTO]: Standard/Agile encryption and protection hashes."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
cfb = "0.14"
aes = "0.8"
cbc = "0.1"
ecb = "0.1"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
getrandom = "0.4"
quick-xml.workspace = true
thiserror.workspace = true

# Browser WASM: crypto.getRandomValues through wasm-bindgen.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true