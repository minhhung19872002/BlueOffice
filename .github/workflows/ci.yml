name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo clippy -p bo-wasm -p bo-collab -p bo-formula --target wasm32-unknown-unknown -- -D warnings
      - run: cargo build -p bo-wasm --target wasm32-unknown-unknown --release

  cargo-deny:
    name: cargo deny (licenses, advisories, bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  web:
    name: Web (lint, typecheck, unit, build, E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install wasm-bindgen CLI (must match crate version)
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:wasm
      - run: cargo build -p bo-cli
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm license-check
      - run: pnpm --filter @blueoffice/web build
      - run: pnpm --filter @blueoffice/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            tests/e2e/playwright-report
            tests/fidelity/output

  dotnet:
    name: .NET (format, build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: cargo build -p bo-cli
      - run: dotnet format BlueOffice.sln --verify-no-changes
      - run: dotnet test BlueOffice.sln -c Release

  fidelity:
    name: Fidelity (round-trip corpus + OpenXmlValidator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build -p bo-cli
      - run: npm i -g pnpm@9 && pnpm install --frozen-lockfile
      - run: node scripts/fidelity-report.mjs
      - run: node scripts/visual-diff.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fidelity-report
          path: |
            docs/fidelity-report.md
            tests/fidelity/history.csv
            tests/fidelity/output/roundtrip
            tests/fidelity/output/diff
            docs/fidelity-visual.md

  desktop:
    name: Desktop (Tauri build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @blueoffice/desktop tauri build --no-bundle
      # Desktop E2E through Tauri WebDriver (runner ships Edge + msedgedriver in EDGEWEBDRIVER).
      - run: cargo install tauri-driver --locked
      - run: pnpm test:e2e:desktop
        env:
          MSEDGEDRIVER: ${{ env.EDGEWEBDRIVER }}\msedgedriver.exe
