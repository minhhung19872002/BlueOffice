# BlueOffice web shell + reverse proxy to SEVERAL api instances (docker-compose.multi.yml,
# docs/deploy/README.md "Nhiều instance api").
#
# Editor sessions and collaboration rooms live in the memory of one api instance, so every request of
# one file must reach the same instance:
#   * /collab/{fileId} (WebSocket) and requests carrying ?file= (POST /api/sessions, /edit) are spread
#     with a consistent hash of the file id;
#   * /api/sessions/{instance}~{id}/... go to the instance named by the session id (its host name);
#   * the rest (files, jobs, health…) is load balanced.
# Rooms also hold a lease in Redis (Collab__Ownership=Redis): if the hash moves a file to another
# instance while its room is open there, the new instance closes the WebSocket with code 4009 and the
# client opens a new session once the old room has closed.
map $http_accept $edit_backend {
    default        web;
    ~application/json api;
}

map $uri $bo_collab_file {
    ~^/collab/(?<f>[^/]+)$ $f;
    default "";
}

map "$bo_collab_file$arg_file" $bo_route {
    ""      $request_id;
    default "$bo_collab_file$arg_file";
}

map $uri $bo_session_instance {
    ~^/api/sessions/(?<i>[A-Za-z0-9_-]+)~ $i;
    default "";
}

upstream bo_api {
    hash $bo_route consistent;
    server api-1:8080;
    server api-2:8080;
}

server {
    listen 8081;
    root /usr/share/nginx/html;
    client_max_body_size 210m;
    # Docker's DNS, for the per-instance routes below.
    resolver 127.0.0.11 valid=10s;

    types { application/wasm wasm; }
    include /etc/nginx/mime.types;

    # Session API: to the instance that holds the session.
    location ~ ^/api/sessions/[A-Za-z0-9_-]+~ {
        proxy_pass http://$bo_session_instance:8080;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(api|hosting|health|convert|thumbnail|preview|extract-text|jobs)(/|$) {
        proxy_pass http://bo_api;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /collab/ {
        proxy_pass http://bo_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location = /edit {
        if ($request_method = POST) { proxy_pass http://bo_api; }
        if ($edit_backend = api) { proxy_pass http://bo_api; }
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
