[package]
name = "bo-sign"
description = "Digital signatures: PAdES (PDF) and ECMA-376 Part 2 package signatures (OOXML), with pluggable signers (USB token / remote CA)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# HTTP transport (ureq + rustls) for RFC 3161 time-stamp authorities and the
# remote signing service. Off for WASM: the browser goes through `fetch`.
http = ["dep:ureq"]
# PKCS#11 USB tokens (cryptoki). Desktop only.
pkcs11 = ["dep:cryptoki"]
# Certificate files `.p12` / `.pfx` (PKCS#12).
pkcs12 = ["dep:p12-keystore"]

[dependencies]
bo-opc.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sha1 = { version = "0.10", features = ["oid"] }
rsa = { version = "0.9", features = ["sha2", "sha1"] }
x509-cert = { version = "0.2", features = ["builder"] }
cms = "0.2"
der = { version = "0.7", features = ["alloc", "derive", "oid", "std"] }
spki = "0.7"
const-oid = { version = "0.9", features = ["db"] }
base64 = "0.22"
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }
cryptoki = { version = "0.12", optional = true }
p12-keystore = { version = "0.4", optional = true }

[dev-dependencies]
rand = "0.8"
lopdf = { version = "0.38", default-features = false }
pdf-writer.workspace = true

[lints]
workspace = true
