# BlueOffice web shell (apps/web/dist) + reverse proxy to the API container.
map $http_accept $edit_backend {
    default        web;
    ~application/json api;
}

server {
    listen 8081;
    root /usr/share/nginx/html;
    client_max_body_size 210m;

    # WASM must be served with its media type for streaming compilation.
    types { application/wasm wasm; }
    include /etc/nginx/mime.types;

    location ~ ^/(api|hosting|health|convert|thumbnail|preview|extract-text|jobs)(/|$) {
        proxy_pass http://api:8080;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /collab/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # /edit: browsers (iframe) get the editor shell; API clients asking for
    # JSON and WOPI form POSTs ([MS-WOPI] §3.1.5.1.1.2) go to the API.
    location = /edit {
        if ($request_method = POST) { proxy_pass http://api:8080; }
        if ($edit_backend = api) { proxy_pass http://api:8080; }
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
